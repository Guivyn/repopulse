<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="title desc">
  <title id="title">RepoPulse — read Git history with context</title>
  <desc id="desc">A project-specific diagram: Git commits, changed paths, and patches branch into a pulse health snapshot or a trace backed by inspected diffs.</desc>

  <rect width="1200" height="430" rx="22" fill="#F5F4EF"/>
  <rect x="1" y="1" width="1198" height="428" rx="21" fill="none" stroke="#D5D7D0" stroke-width="2"/>

  <g id="identity" transform="translate(64 58)">
    <circle cx="8" cy="0" r="5" fill="#176B55"/>
    <text x="24" y="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="20" font-weight="600" letter-spacing="1.4" fill="#59625F">CODEX SKILL / GIT HISTORY</text>

    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="78" font-weight="700" letter-spacing="-2.5" fill="#171C1B">RepoPulse</text>
    <text x="2" y="151" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="25" font-weight="500" fill="#3C4542">A quick read on repository health.</text>
    <text x="2" y="185" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="25" font-weight="500" fill="#3C4542">A careful answer from Git history.</text>

    <line x1="2" y1="224" x2="500" y2="224" stroke="#CFD2CB" stroke-width="2"/>
    <text x="2" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="600" letter-spacing="1.1" fill="#68716D">ASK IN CODEX</text>
    <text x="2" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="23" fill="#176B55">$ repopulse pulse</text>
    <text x="2" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="23" fill="#345E8C">$ repopulse trace "…"</text>
  </g>

  <g id="history-to-answers" transform="translate(642 58)">
    <text x="0" y="7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="600" letter-spacing="1.1" fill="#68716D">ONE SOURCE · TWO READS</text>
    <line x1="0" y1="29" x2="494" y2="29" stroke="#CFD2CB" stroke-width="2"/>

    <g id="git-history">
      <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="600" letter-spacing="1" fill="#59625F">GIT HISTORY</text>

      <path d="M19 104 V285" fill="none" stroke="#9EA6A0" stroke-width="3"/>
      <circle cx="19" cy="119" r="8" fill="#F5F4EF" stroke="#3C4542" stroke-width="3"/>
      <circle cx="19" cy="184" r="8" fill="#F5F4EF" stroke="#3C4542" stroke-width="3"/>
      <circle cx="19" cy="249" r="8" fill="#F5F4EF" stroke="#3C4542" stroke-width="3"/>
      <text x="43" y="126" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="21" fill="#242B29">commits</text>
      <text x="43" y="191" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="21" fill="#242B29">changed paths</text>
      <text x="43" y="256" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="21" fill="#242B29">patches</text>
    </g>

    <g id="branch-lines" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M158 119 H190 V119 H224" stroke="#176B55" stroke-width="2.5"/>
      <path d="M158 249 H190 V257 H224" stroke="#345E8C" stroke-width="2.5"/>
      <path d="M190 119 V257" stroke="#CFD2CB" stroke-width="2"/>
      <circle cx="224" cy="119" r="5" fill="#176B55" stroke="none"/>
      <circle cx="224" cy="257" r="5" fill="#345E8C" stroke="none"/>
    </g>

    <g id="pulse-route" transform="translate(250 91)">
      <rect x="0" y="0" width="5" height="58" rx="2.5" fill="#176B55"/>
      <text x="20" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="24" font-weight="700" fill="#176B55">PULSE</text>
      <text x="20" y="53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="20" fill="#3C4542">rhythm · churn · PRs</text>
    </g>

    <g id="trace-route" transform="translate(250 229)">
      <rect x="0" y="0" width="5" height="58" rx="2.5" fill="#345E8C"/>
      <text x="20" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="24" font-weight="700" fill="#345E8C">TRACE</text>
      <text x="20" y="53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="20" fill="#3C4542">commit · diff · evidence</text>
    </g>

    <line x1="0" y1="325" x2="494" y2="325" stroke="#CFD2CB" stroke-width="2"/>
    <text x="0" y="359" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#68716D">GIT REQUIRED</text>
    <text x="258" y="359" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#68716D">gh OPTIONAL</text>
  </g>
</svg>
